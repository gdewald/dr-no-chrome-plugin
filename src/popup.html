<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Dr. No</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; width: 260px; padding: 16px;
      background: #0f172a; color: #e2e8f0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 { margin: 0 0 2px; font-size: 16px; color: #f8fafc; }
    p.sub { margin: 0 0 14px; font-size: 12px; color: #94a3b8; }
    .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .row label { font-weight: 600; }
    /* toggle switch */
    .switch { position: relative; display: inline-block; width: 46px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; cursor: pointer; background: #475569;
      border-radius: 9999px; transition: background .15s ease;
    }
    .slider::before {
      content: ""; position: absolute; height: 20px; width: 20px; left: 3px; top: 3px;
      background: #f8fafc; border-radius: 50%; transition: transform .15s ease;
    }
    input:checked + .slider { background: #38bdf8; }
    input:checked + .slider::before { transform: translateX(20px); }
    #state { font-size: 12px; color: #94a3b8; }
    a.options {
      display: block; text-align: center; margin-top: 8px; padding: 8px;
      font-size: 13px; font-weight: 600; color: #38bdf8; text-decoration: none;
      border: 1px solid #334155; border-radius: 9999px;
    }
    a.options:hover { background: #1e293b; }
  </style>
</head>
<body>
  <h1>Dr. No 🩺🚫</h1>
  <p class="sub">Step away from the symptoms.</p>

  <div class="row">
    <label for="enabled">Protection</label>
    <span class="switch">
      <input type="checkbox" id="enabled" />
      <span class="slider"></span>
    </span>
  </div>
  <p id="state">…</p>

  <a class="options" id="openOptions" href="#">Settings & characters →</a>

  <script src="popup.js"></script>
</body>
</html>
