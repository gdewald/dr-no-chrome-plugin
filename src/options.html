<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dr. No — Options</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      padding: 32px;
      max-width: 720px;
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    h1 { margin: 0 0 4px; font-size: 24px; color: #f8fafc; }
    .tagline { margin: 0 0 28px; color: #94a3b8; }
    section { margin-bottom: 28px; }
    label.field { display: block; font-weight: 600; margin-bottom: 8px; color: #f1f5f9; }
    .hint { font-weight: 400; color: #94a3b8; font-size: 13px; }
    textarea {
      width: 100%; min-height: 110px; box-sizing: border-box;
      background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
      border-radius: 10px; padding: 12px; font: 14px/1.4 Consolas, monospace; resize: vertical;
    }
    .toggle { display: flex; align-items: center; gap: 12px; }
    .toggle input { width: 18px; height: 18px; }
    .chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .char {
      border: 1px solid #334155; border-radius: 12px; padding: 12px; cursor: pointer;
      background: #1e293b; transition: border-color .15s ease;
    }
    .char:has(input:checked) { border-color: #38bdf8; box-shadow: 0 0 0 1px #38bdf8; }
    .char pre { margin: 8px 0 0; color: #7dd3fc; font: 12px/1.2 Consolas, monospace; white-space: pre; overflow-x: auto; }
    .char .row { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    button.save {
      appearance: none; border: 0; cursor: pointer; border-radius: 9999px;
      padding: 12px 28px; font-size: 15px; font-weight: 600; color: #0f172a; background: #38bdf8;
    }
    button.save:hover { background: #7dd3fc; }
    #status { margin-left: 14px; color: #4ade80; font-weight: 600; opacity: 0; transition: opacity .2s ease; }
    #status.show { opacity: 1; }
    .bar { height: 8px; background: #1e293b; border: 1px solid #334155; border-radius: 9999px; overflow: hidden; }
    .bar .fill { height: 100%; width: 0%; background: #38bdf8; border-radius: 9999px; transition: width .3s ease; }
    .bar.indeterminate .fill { width: 30%; animation: dr-no-slide 1.2s linear infinite; }
    @keyframes dr-no-slide { from { margin-left: -30%; } to { margin-left: 100%; } }
  </style>
</head>
<body>
  <h1>Dr. No 🩺🚫</h1>
  <p class="tagline">Blocks medical searches and self-diagnosis rabbit holes with a friendly ASCII friend.</p>

  <section>
    <div class="toggle">
      <input type="checkbox" id="enabled" />
      <label class="field" for="enabled" style="margin:0;">Enabled</label>
    </div>
  </section>

  <section>
    <div class="toggle">
      <input type="checkbox" id="aiEnabled" />
      <label class="field" for="aiEnabled" style="margin:0;">On-device AI arbiter
        <span class="hint">— borderline searches the keyword rules can't call are decided by
        Chrome's built-in model (Gemini Nano). Runs entirely on this device; nothing is sent anywhere.</span></label>
    </div>
    <p class="hint" id="aiStatus" style="margin:10px 0 0 30px;"></p>
    <div id="aiProgress" style="display:none; margin:10px 0 0 30px;">
      <div class="bar" id="aiBar"><div class="fill" id="aiFill"></div></div>
    </div>
    <button type="button" class="save" id="aiDownload" style="display:none; margin:10px 0 0 30px;">Download model</button>
  </section>

  <section>
    <label class="field" for="extraKeywords">Extra blocked terms
      <span class="hint">— one per line, added to the built-in list.</span></label>
    <textarea id="extraKeywords" placeholder="sniffle&#10;webmd&#10;my knee hurts"></textarea>
  </section>

  <section>
    <label class="field" for="extraSites">Extra blocked sites
      <span class="hint">— domains, one per line (e.g. example-health.com).</span></label>
    <textarea id="extraSites" placeholder="example-health.com&#10;forum.medical.example"></textarea>
  </section>

  <section>
    <label class="field">Character</label>
    <div class="chars" id="chars"></div>
  </section>

  <button class="save" id="save">Save</button>
  <span id="status">Saved ✓</span>

  <script src="data.js"></script>
  <script src="options.js"></script>
</body>
</html>
